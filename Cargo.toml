[package]
name = "poulpy-shaped"
version = "0.1.0"
edition = "2024"
description = "Approximate homomorphic encryption for small batches of complex numbers, with shaped rounding, on poulpy"
license = "Apache-2.0"
repository = "https://github.com/jdumezy/eprint-2026-2513"
publish = false

[dependencies]
poulpy-hal = "=0.9.0"
poulpy-core = "=0.9.0"
poulpy-ckks = "=0.9.0"
anyhow = "1"
bytemuck = "1"

[dev-dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
poulpy-cpu-portable = { version = "=0.9.0", features = ["enable-ckks"] }

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
poulpy-cpu-arm = { version = "=0.9.0", features = ["enable-neon", "enable-ckks", "enable-rayon"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = [".", "bench"]
