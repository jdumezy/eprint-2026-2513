[package]
name = "poulpy-shaped-bench"
version = "0.1.0"
edition = "2024"
description = "Benchmarks of poulpy-shaped against sparse CKKS and PaCo, reproducing the tables of the paper"
license = "Apache-2.0"
repository = "https://github.com/jdumezy/eprint-2026-2513"
publish = false

[dependencies]
poulpy-shaped = { path = ".." }
poulpy-hal = "=0.9.0"
poulpy-core = "=0.9.0"
poulpy-ckks = { version = "=0.9.0", features = ["test-utils"] }
poulpy-cpu-portable = { version = "=0.9.0", features = ["enable-ckks"] }
anyhow = "1"

[target.'cfg(target_arch = "aarch64")'.dependencies]
poulpy-cpu-arm = { version = "=0.9.0", features = ["enable-neon", "enable-ckks", "enable-rayon"] }
